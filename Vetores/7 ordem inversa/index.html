<script>
    let numero = [];
    for (let i=0; i<10; i++) {
        numero[i]=parseInt(prompt("Digite o " + (i+1) +" numero:"));
    }

    document.write("vetor original: "+numero+ "<br>");
    document.write("Ordem inversa:");
    
    for (let i=9; i>=0; i--) {
        document.write(numero[i]+ " ");
    }

    
</script>
