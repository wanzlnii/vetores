<script>
    let numero = [];
    let par = 0;
    let impar = 0;
    
    for (let i = 0; i < 10; i++) {
        numero[i] = parseFloat(prompt("digite o " + (i+1) +"° numero:"));
        if (numero[i] % 2 === 0) {
            par++;
        } else {
            impar++;
        }

    }
    document.write("numeros digitados: "+ numero + "<br>");
    document.write("Quantidade de números pares: "+par+ "<br>");
    document.write("Quantidade de números impares: " +impar );
</script>
