<script>
    let numero = []
    for (let i=0; i <10; i++) {
        numero [i] = parseInt(prompt("digite o " +(i+1)+ "° número" ));
    }

    let pesquisa = parseInt(prompt("DIgite um numero pra verificar no vetor"));
    let encontrado = false;
    for (let i=0; i <10; i++) {
        if (numero[i] === pesquisa) {
            encontrado = true;
            break
        }
    }
    document.write ("números no vetor: " +numero+ "<br>")
    if (encontrado) {
        document.write("o numero " +pesquisa+  "foi encontrado no vetor" + "<br>"); 
    } else {document.write("o numero " +pesquisa+  "não foi encontrado no vetor");
    }
</script>
